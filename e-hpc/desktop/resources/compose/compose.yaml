# desktop/resources/compose/compose.yaml — compose de DESPLIEGUE empaquetado
# (electron-spec.md §6.1): solo `image:`, cero `build:` (los contextos del
# compose raíz no existen bajo process.resourcesPath en una máquina con solo
# el instalador). Puertos, environment y volumes idénticos al compose raíz
# (architecture.md §2.2); todos los puertos ligados a 127.0.0.1.
name: ehpc
services:
  frontend:
    image: ghcr.io/jorgesierra/ehpc-frontend:1.0.0
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    image: ghcr.io/jorgesierra/ehpc-backend:1.0.0
    ports: ["127.0.0.1:8000:8000"]
    environment:
      EHPC_DB_PATH: /app/data/ehpc.db
      EHPC_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080,null"
      EHPC_CODE_DELIVERY: volume
      EHPC_SUBMISSIONS_VOLUME: ehpc_submissions
      EHPC_RUNNER_IMAGE: ghcr.io/jorgesierra/ehpc-runner:0.5.1
      EHPC_MAX_TIMEOUT_S: 120
      EHPC_MAX_CONCURRENT_JOBS: 2
    volumes:
      - ehpc_data:/app/data
      - ehpc_submissions:/submissions
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  runner:
    image: ghcr.io/jorgesierra/ehpc-runner:0.5.1
    profiles: ["build"]        # nunca corre como servicio; `up` lo ignora
    entrypoint: ["true"]

volumes:
  ehpc_data:
  ehpc_submissions:
