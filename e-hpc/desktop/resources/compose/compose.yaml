# desktop/resources/compose/compose.yaml — compose de DESPLIEGUE empaquetado
# (electron-spec.md §6.1): solo `image:`, cero `build:` (los contextos del
# compose raíz no existen bajo process.resourcesPath en una máquina con solo
# el instalador). Puertos, environment y volumes idénticos al compose raíz
# (architecture.md §2.2); todos los puertos ligados a 127.0.0.1.
name: ehpc
services:
  backend:
    image: ghcr.io/jorgesierra/ehpc-backend:1.0.0
    ports: ["127.0.0.1:8000:8000"]
    environment:
      EHPC_DB_PATH: /app/data/ehpc.db
      # Despliegue por defecto = ESTUDIANTE: el modo autoría (admin) está
      # APAGADO y /api/v1/admin/* responde 401. Un despliegue admin añade
      # `EHPC_ADMIN_MODE: "1"` a este servicio backend (app local en loopback
      # distribuida solo a administradores; sin login/token).
      # Idéntica al compose raíz: el navegador manda Origin http://127.0.0.1:8080
      # (no localhost); 'null' es para Electron (file://).
      EHPC_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,null"
      EHPC_CODE_DELIVERY: volume
      EHPC_SUBMISSIONS_VOLUME: ehpc_submissions
      EHPC_RUNNER_IMAGE: ghcr.io/jorgesierra/ehpc-runner:0.5.1
      EHPC_MAX_TIMEOUT_S: 120
      EHPC_MAX_CONCURRENT_JOBS: 2
    volumes:
      - ehpc_data:/app/data
      - ehpc_submissions:/submissions
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  runner:
    image: ghcr.io/jorgesierra/ehpc-runner:0.5.1
    profiles: ["build"]        # nunca corre como servicio; `up` lo ignora
    entrypoint: ["true"]

volumes:
  # name: explícito para compartir el MISMO volumen de datos entre despliegues
  # (estudiante / admin) y desactivar el prefijo del proyecto ('name: ehpc').
  ehpc_data:
    name: ehpc_data
  # name: explícito para DESACTIVAR el prefijo del proyecto ('name: ehpc'
  # arriba): sin él, Compose crea 'ehpc_ehpc_submissions' mientras el runner
  # monta el literal EHPC_SUBMISSIONS_VOLUME → volumen vacío → todos los jobs
  # fallan con 'no such file or directory' (igual que compose.yaml raíz).
  ehpc_submissions:
    name: ehpc_submissions
