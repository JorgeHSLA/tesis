# electron-builder.yml — electron-spec.md §6 (propiedad de WP8).
# Ajustes de WP8 sobre el literal del spec:
#   - extraMetadata.homepage: requerido por el target deb (fpm falla sin él).
#   - extraMetadata.desktopName + linux.syncDesktopName: asociación de ventana
#     (WM_CLASS ↔ .desktop) en entornos Linux.
appId: edu.telar.desktop
productName: Telar
directories:
  output: release
files:
  - dist-electron/**
  - package.json
extraMetadata:
  main: dist-electron/main.cjs
  homepage: https://github.com/jorgesierra/e-hpc
  desktopName: Telar.desktop
extraResources:
  - from: ../frontend/dist            # el MISMO build de Vite que sirve nginx
    to: app-frontend
  - from: resources/compose           # compose.yaml de despliegue local (backend+web+runner)
    to: compose
asar: true

win:
  target: [nsis, portable]
  icon: resources/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

linux:
  target: [AppImage, deb]
  icon: resources/icons               # png 16..512 (generados, sin marcas de terceros)
  category: Education
  maintainer: Jorge Sierra <jorgesierralaiton@gmail.com>
  synopsis: Simulador educativo de OpenMP con PyOMP
  syncDesktopName: true
