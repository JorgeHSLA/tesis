# compose.yaml (sin clave `version:` — obsoleta en Compose v2+)
# Literal de docs/architecture/architecture.md §2.2 (CONGELADO).
# REGLA DE SEGURIDAD: todos los puertos ligados a 127.0.0.1. El backend no
# tiene autenticación y monta el socket Docker: publicarlo en 0.0.0.0
# expondría ejecución de código y el historial a toda la LAN. Ningún puerto
# del stack debe escuchar fuera de loopback.
services:
  frontend:
    build: ./frontend            # multi-stage: node:22 build -> nginx:alpine (ver §10.2)
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    # Nivel 3 (seguridad por AUSENCIA, ver backend/Dockerfile): TELAR_ADMIN_BUILD
    # selecciona la imagen desde UN codebase. Por defecto 0 ⇒ build ESTUDIANTE
    # (sin código admin en el artefacto; /api/v1/admin/* → 404). La imagen ADMIN
    # se construye con `TELAR_ADMIN_BUILD=1 docker compose build backend` (y el
    # runtime la sigue gateando TELAR_ADMIN_MODE).
    build:
      context: ./backend
      args:
        TELAR_ADMIN_BUILD: "${TELAR_ADMIN_BUILD:-0}"
    ports: ["127.0.0.1:8000:8000"]
    environment:
      TELAR_DB_PATH: /app/data/ehpc.db
      # Modo autoría (admin): apagado por defecto (=0 ⇒ ESTUDIANTE, /api/v1/admin/*
      # responde 401). Se enciende con la env del shell:
      #   TELAR_ADMIN_MODE=1 docker compose up -d backend
      # (Compose es declarativo → recrea el contenedor al cambiar el valor, así
      # `telar` puede alternar estudiante⇄admin). App local en loopback
      # distribuida solo a administradores; sin login/token.
      TELAR_ADMIN_MODE: "${TELAR_ADMIN_MODE:-0}"
      # 'null' es necesario para Electron (file://); riesgo residual documentado
      # en api-contract.md §0 — mitigado por el bind a loopback.
      TELAR_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,null"
      TELAR_CODE_DELIVERY: volume            # 'volume' (compose) | 'bind' (dev nativo)
      TELAR_SUBMISSIONS_VOLUME: ehpc_submissions
      TELAR_RUNNER_IMAGE: ehpc-runner:0.5.1
      TELAR_MAX_TIMEOUT_S: 0                 # 0 = sin límite (tope opcional)
      TELAR_MAX_CONCURRENT_JOBS: 2
    volumes:
      - ehpc_data:/app/data
      - ehpc_submissions:/submissions        # rw en backend; el runner lo monta :ro
      - /var/run/docker.sock:/var/run/docker.sock   # ver §5 (riesgo documentado)
    healthcheck:
      # python-urllib: python:3.12-slim no trae curl/wget.
      # /health devuelve 200 aunque falte la imagen runner (liveness, no
      # readiness — api-contract.md §2.1): sin esto, el primer arranque
      # dejaría al backend unhealthy y nginx jamás arrancaría.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Imagen del runner: se CONSTRUYE con compose pero NO corre como servicio
  # (la instancia el backend por la API, un contenedor efímero por job).
  runner:
    build: ./runner
    image: ehpc-runner:0.5.1
    profiles: ["build"]          # `docker compose --profile build build runner`
    entrypoint: ["true"]

volumes:
  # name: explícito para compartir el MISMO volumen de datos entre despliegues
  # (estudiante / admin) y desactivar el prefijo del proyecto Compose.
  ehpc_data:
    name: ehpc_data
  # Nombre explícito para DESACTIVAR el prefijo del proyecto Compose: así el
  # volumen real es 'ehpc_submissions' (no '<proyecto>_ehpc_submissions') y
  # coincide con source=TELAR_SUBMISSIONS_VOLUME que el backend pasa al runner
  # en docker_service._code_mount_kwargs. Sin esto, backend escribe en el
  # volumen prefijado y el runner monta OTRO volumen vacío → 'no such file'.
  ehpc_submissions:
    name: ehpc_submissions
