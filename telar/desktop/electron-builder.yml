# electron-builder.yml — electron-spec.md §6 (propiedad de WP8).
# Ajustes de WP8 sobre el literal del spec:
#   - extraMetadata.homepage: requerido por el target deb (fpm falla sin él).
#   - extraMetadata.desktopName + linux.syncDesktopName: asociación de ventana
#     (WM_CLASS ↔ .desktop) en entornos Linux.
appId: edu.telar.desktop
productName: Telar
directories:
  output: release
files:
  - dist-electron/**
  - package.json
extraMetadata:
  main: dist-electron/main.cjs
  homepage: https://github.com/jorgesierra/telar
  desktopName: Telar.desktop
extraResources:
  - from: ../frontend/dist            # el MISMO build de Vite que sirve nginx
    to: app-frontend
  - from: resources/compose           # compose.yaml de despliegue local (backend+web+runner)
    to: compose
asar: true

win:
  target: [nsis, portable]
  icon: resources/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  # customUnInstall en resources/installer.nsh: al desinstalar (no al
  # actualizar) para y borra el contenedor y las imágenes Docker de Telar.
  include: resources/installer.nsh

linux:
  target: [AppImage, deb]
  icon: resources/icons               # png 16..512 (generados, sin marcas de terceros)
  category: Education
  maintainer: Jorge Sierra <jorgesierralaiton@gmail.com>
  synopsis: Simulador educativo de OpenMP con PyOMP
  syncDesktopName: true
  # Defensa en profundidad para el bug ozone/wayland (ver comentario en
  # src/main.ts sobre XDG_SESSION_TYPE=wayland). El runtime detection de
  # main.ts ya fuerza x11 al arrancar, pero además hacemos que el `.desktop`
  # que instala el `.deb` pase el flag desde el launcher del sistema: si por
  # cualquier motivo el bloque runtime fallara (build corrupto, edición
  # posterior), el icono sigue abriendo la ventana en Wayland. X11 y XWayland
  # existen en todas las distros que soportamos; `--ozone-platform=x11` es
  # inocuo en sesiones X11 nativas.
  # `linux.desktop.entry.Exec` NO es válido en electron-builder 26 (falla el
  # build: "Please specify executable name as linux.executableName instead")
  # — la vía soportada para argumentos extra en el Exec es executableArgs.
  executableArgs:
    - --ozone-platform=x11

# `deb` es clave de PRIMER NIVEL (hermana de `linux`), igual que `nsis` lo es
# de `win`: anidarla dentro de `linux` hace fallar la validación del esquema.
deb:
  # `depends` REEMPLAZA la lista por defecto de electron-builder, así que hay
  # que repetirla entera. El añadido es libasound2: el binario de Electron
  # enlaza libasound.so.2 y la lista por defecto NO la declara. En un Ubuntu
  # Desktop completo pasa inadvertido (la trae el escritorio), pero en un
  # sistema mínimo —WSL, Server, contenedor— la app aborta al arrancar con
  # "error while loading shared libraries: libasound.so.2" (verificado en
  # WSL Ubuntu 2026-08-25; con las 9 dependencias declaradas instaladas, era
  # la ÚNICA librería que faltaba).
  # La alternativa `t64 | clásico` cubre las dos épocas de Ubuntu: 24.04+
  # renombró el paquete a libasound2t64 y el nombre suelto libasound2 ya no
  # es instalable ahí.
  depends:
    - libasound2t64 | libasound2
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  # electron-builder no tiene un campo con nombre propio para el hook PREVIO
  # al borrado (solo declara afterInstall/afterRemove); se pasa como flag
  # crudo de fpm, que lo traduce al script prerm de dpkg. Al desinstalar (no
  # al actualizar) para y borra el contenedor y las imágenes Docker de Telar
  # — resources/before-remove.sh, corre ANTES de que dpkg borre
  # /opt/Telar/resources/compose/compose.yaml.
  fpm:
    - --before-remove=resources/before-remove.sh
