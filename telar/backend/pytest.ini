; Configuración pytest del backend Telar (WP9).
; Criterio de aceptación (desde backend/):
;   pytest --cov=app --cov-fail-under=80        <- suite integral (tests/)
; El smoke real contra el daemon Docker es OPT-IN:
;   pytest -m docker tests/test_docker_smoke.py
;
; NOTA: las suites locales tests_local_wp1..wp3 se ejecutan POR SEPARADO
; (`pytest tests_local_wp1` etc.): usan `from conftest import ...` con
; conftest.py homónimos sin paquete, y colisionan entre sí si se recolectan
; en una sola invocación. `testpaths` apunta por ello solo a tests/.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    docker: smoke real contra el daemon Docker y la imagen runner (opt-in)
addopts = -m "not docker"
